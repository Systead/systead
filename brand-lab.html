<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Systead Brand Candidates</title>
  <link rel="stylesheet" href="assets/css/site.css">
  <style>
    .candidate-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:24px; padding:60px 0 100px; }
    .candidate { border:1px solid var(--line); padding:22px; text-align:center; }
    .candidate img { width:100%; height:auto; display:block; }
    @media(max-width:800px){.candidate-grid{grid-template-columns:1fr;}}
  </style>
</head>
<body>
  <header class="wrap"><nav><div class="wordmark">SYSTEAD / BRAND LAB</div><div class="status">Candidates only</div></nav></header>
  <main class="wrap">
    <h1>Working marks.</h1>
    <p class="lead">Neither candidate is locked. Review small-size legibility, originality, monochrome use, favicon use, and legal clearance before selection.</p>
    <div class="candidate-grid">
      <div class="candidate"><img src="assets/img/systead-mark-a.png" alt="Systead mark candidate A"><h2>Candidate A</h2></div>
      <div class="candidate"><img src="assets/img/systead-mark-b.png" alt="Systead mark candidate B"><h2>Candidate B</h2></div>
    </div>
  </main>
</body>
</html>
