name: Feature proposal
description: Propose a bounded improvement
title: "[Proposal]: "
labels: ["proposal", "needs-triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Operator problem
      description: Describe the problem before describing the feature.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Privacy, risk, and rollback considerations
    validations:
      required: true
